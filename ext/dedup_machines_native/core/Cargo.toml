[package]
name = "dedup-machines"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded exact duplicate claims with generation-checked completion"
readme = "README.md"
exclude = ["src/**/tests.rs", "tests/"]
keywords = ["deduplication", "idempotency", "ttl", "exactly-once", "no-std"]
categories = ["no-std", "algorithms"]
[features]
default = []
alloc = ["dep:hashbrown"]
std = ["alloc"]

[dependencies]
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"], optional = true }

[lints]
workspace = true
